name: Build OpenLearnOS Desktop (Tauri v2 < 15 MB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon DMG (< 15 MB Gate)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies & verify invariants
        run: |
          npm ci
          VITE_BASE_PATH="./" npm run verify

      - name: Build Tauri v2 macOS Bundle (.dmg / .app)
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles dmg

      - name: Enforce Size Invariant (< 15 MB)
        run: |
          DMG=$(find apps/desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          test -n "$DMG"
          BYTES=$(stat -f%z "$DMG")
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / 1048576}")
          echo "Built macOS DMG: $DMG ($MB MB)"
          awk -v b="$BYTES" 'BEGIN { if (b >= 15728640) { print "FAIL: DMG exceeds 15 MB invariant"; exit 1 } else { print "PASS: DMG is strictly under 15 MB invariant" } }'

      - name: Upload macOS Apple Silicon Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLearnOS-macOS-AppleSilicon-DMG
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
