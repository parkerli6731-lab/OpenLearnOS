[package]
name = "openlearnos-desktop"
version = "0.3.0"
description = "OpenLearnOS zero-friction local-first desktop shell (Tauri v2)"
authors = ["OpenLearnOS Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "openlearnos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
